# MicroTCA crate monitoring: mch_exporter --(HTTP)--> Prometheus -> Grafana
#
#   cd deploy && docker compose up -d
#
#   Grafana    http://127.0.0.1:3000   admin / admin (change it)
#   Prometheus http://127.0.0.1:9090
#
# The exporter is NOT a container: it shells out to `ipmitool`, and these
# NAT-MCHs only answer `ipmitool -I lan -A none` (FreeIPMI/ipmi_exporter cannot
# open a session against them -- see ../README.md). Run one exporter per crate
# on the host:
#
#   python3 mch_exporter.py --config ../crate-192.0.2.32-shelf.json --port 9290
#   python3 mch_exporter.py --config ../crate.json                      --port 9291
#
# Prometheus reaches them through the docker bridge gateway.

name: mtca-monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: mtca-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus:/etc/prometheus:ro   # includes crates.yml (file_sd)
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # the exporter runs on the host (it shells out to ipmitool); give the
      # docker bridge gateway a readable name instead of host.docker.internal
      - "mch-exporter:host-gateway"

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: mtca-renderer
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"
      AUTH_TOKEN: mtca-dev-token

  grafana:
    image: grafana/grafana:latest
    container_name: mtca-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # read-only anonymous access, loopback-bound, so the dashboard
      # can be screenshotted / embedded without embedding credentials
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # server-side PNG rendering for the dashboard (and for docs/screenshots)
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: mtca-dev-token
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
