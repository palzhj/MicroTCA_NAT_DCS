# Crates come from crates.yml, generated by mch_inventory.py from
# crates/crate-aliases.json -- so adding a crate never means editing Prometheus.

global:
  scrape_interval: 30s
  evaluation_interval: 60s

scrape_configs:
  # Matched to the exporter's sweep (~178 s of IPMI + 5 s gap), so the TSDB
  # holds one point per real measurement instead of six identical copies.
  # Scraping is still free for the crate: the exporter answers from cache.
  - job_name: mtca
    scrape_interval: 180s
    scrape_timeout: 30s
    file_sd_configs:
      - files: ['crates.yml']
        refresh_interval: 1m

  # Crates with a small sweep ("fast": true in crate-aliases.json). Prometheus
  # sets the interval per job, so they cannot share the 180 s above.
  - job_name: mtca-fast
    scrape_interval: 90s
    scrape_timeout: 30s
    file_sd_configs:
      - files: ['crates-fast.yml']
        refresh_interval: 1m
